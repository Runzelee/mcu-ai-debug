<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; style-src 'nonce-${nonce}'; script-src 'nonce-${nonce}';">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Watch Graph</title>
    <style nonce="${nonce}">
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--vscode-editor-background);
            color: var(--vscode-editor-foreground);
            font-family: var(--vscode-font-family, 'Segoe UI', sans-serif);
            font-size: var(--vscode-font-size, 13px);
            overflow: hidden;
            height: 100vh;
            width: 100%;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .toolbar {
            display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
            padding: 8px 12px; background: var(--vscode-editor-background);
            border-bottom: 1px solid var(--vscode-panel-border); flex-shrink: 0;
        }
        .tool-group { display: flex; align-items: center; gap: 4px; }
        .toolbar button {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            min-height: 28px; padding: 4px 8px; border: 1px solid transparent; border-radius: 4px;
            background: transparent; color: var(--vscode-foreground); cursor: pointer; font: inherit; font-size: 12px;
        }
        .toolbar button:hover { background: var(--vscode-toolbar-hoverBackground); }
        .toolbar button.active { background: var(--vscode-toolbar-activeBackground); border-color: var(--vscode-focusBorder); }
        button:focus-visible, select:focus-visible, input:focus-visible { outline: 1px solid var(--vscode-focusBorder); outline-offset: 2px; }
        .icon-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
        .button-icon { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.4; flex-shrink: 0; }
        .toolbar .spacer { flex: 1; min-width: 0; }
        .toolbar label { font-size: 12px; color: var(--vscode-descriptionForeground); }
        .control-group { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
        .toolbar select, .toolbar input[type="number"] {
            background: var(--vscode-input-background); color: var(--vscode-input-foreground);
            border: 1px solid var(--vscode-input-border, var(--vscode-panel-border));
            height: 26px; padding: 2px 6px; border-radius: 3px; font: inherit; font-size: 12px;
        }
        .toolbar input[type="number"] { width: 64px; }
        .graph-status { display: flex; align-items: center; gap: 6px; color: var(--vscode-descriptionForeground); font-size: 11px; }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--vscode-charts-green, #388a34); }
        .graph-status.paused .status-dot { background: var(--vscode-charts-yellow, #b89500); }
        .series-count { color: var(--vscode-descriptionForeground); font-size: 11px; }
        .empty-state { position: absolute; inset: 0; display: grid; place-content: center; gap: 6px; text-align: center;
            color: var(--vscode-descriptionForeground); pointer-events: none; padding: 24px; }
        .empty-state strong { color: var(--vscode-foreground); font-size: 13px; font-weight: 500; }
        .empty-state span { font-size: 12px; }
        .empty-state[hidden] { display: none; }
        @media (max-width: 600px) { .toolbar { gap: 8px; } .toolbar .spacer { display: none; } .series-count { margin-left: auto; } }

        .chart-area {
            min-width: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .chart-row {
            min-width: 0;
            flex: 1;
            display: flex;
            min-height: 0;
        }

        .chart-container {
            flex: 1;
            position: relative;
            min-width: 0;
        }

        canvas {
            position: absolute; inset: 0;
            display: block;
            width: 100%;
            height: 100%;
        }

        .scrollbar-y {
            width: 14px;
            background: var(--vscode-scrollbar-shadow, #111);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .scrollbar-y input[type="range"] {
            writing-mode: vertical-lr;
            direction: rtl;
            height: calc(100% - 8px);
            width: 14px;
            accent-color: var(--vscode-scrollbarSlider-background, #555);
            cursor: ns-resize;
        }

        .scrollbar-t {
            height: 14px;
            background: var(--vscode-scrollbar-shadow, #111);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-left: 65px;
            margin-right: 74px;
        }

        .scrollbar-t input[type="range"] {
            width: 100%;
            height: 14px;
            accent-color: var(--vscode-scrollbarSlider-background, #555);
            cursor: ew-resize;
        }

        .legend { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px;
            background: var(--vscode-editor-background); border-top: 1px solid var(--vscode-panel-border);
            flex-shrink: 0; max-height: 104px; overflow-y: auto; }
        .legend-item { display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 11px;
            color: var(--vscode-foreground); border: 1px solid var(--vscode-panel-border); background: transparent;
            border-radius: 4px; padding: 4px 7px; min-width: 0; max-width: 100%; cursor: pointer; }
        .legend-item:hover { background: var(--vscode-toolbar-hoverBackground); }
        .legend-item.hidden { opacity: 0.45; }
        .legend-color { width: 10px; height: 3px; border-radius: 1px; flex-shrink: 0; }
        .legend-name { min-width: 0; max-width: min(320px, 60vw); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .legend-value { color: var(--vscode-descriptionForeground); font-family: var(--vscode-editor-font-family, monospace); white-space: nowrap; }

        .tooltip {
            position: absolute;
            background: var(--vscode-editorHoverWidget-background, #252526);
            border: 1px solid var(--vscode-editorHoverWidget-border, #454545);
            color: var(--vscode-editorHoverWidget-foreground, #ccc);
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-family: var(--vscode-editor-font-family, monospace);
            pointer-events: none;
            display: none;
            z-index: 10;
            white-space: pre;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>
    <svg aria-hidden="true" class="icon-sprite">
        <symbol id="icon-pause" viewBox="0 0 16 16"><path d="M5 3v10M11 3v10" stroke-width="2.5"/></symbol>
        <symbol id="icon-play" viewBox="0 0 16 16"><path d="M5 3l8 5-8 5z"/></symbol>
        <symbol id="icon-clear" viewBox="0 0 16 16"><path d="M3 4h10M6 4V2h4v2M4 4l1 10h6l1-10M7 6v5M9 6v5"/></symbol>
        <symbol id="icon-auto" viewBox="0 0 16 16"><path d="M3 8a5 5 0 1 0 1-3M3 2v4h4M6 8l2 2 3-4"/></symbol>
        <symbol id="icon-pan" viewBox="0 0 16 16"><path d="M8 1v14M1 8h14M5 4l3-3 3 3M5 12l3 3 3-3M4 5L1 8l3 3M12 5l3 3-3 3"/></symbol>
    </svg>
    <div class="toolbar" role="toolbar" aria-label="Graph controls">
        <div class="tool-group">
            <button id="btn-pause" title="Pause graph updates" aria-label="Pause graph updates" aria-pressed="false"><svg class="button-icon" aria-hidden="true"><use href="#icon-pause"/></svg><span class="button-label">Pause</span></button>
            <button id="btn-clear" title="Clear graph data" aria-label="Clear graph data"><svg class="button-icon" aria-hidden="true"><use href="#icon-clear"/></svg><span>Clear</span></button>
            <button id="btn-autofit" title="Follow latest samples automatically" aria-label="Follow latest samples automatically" aria-pressed="true"><svg class="button-icon" aria-hidden="true"><use href="#icon-auto"/></svg><span class="button-label">Auto</span></button>
        </div>
        <div id="graph-status" class="graph-status" role="status"><span class="status-dot" aria-hidden="true"></span><span id="status-text">Live</span></div>
        <div class="spacer"></div>
        <div class="control-group"><label for="timespan">Window</label><input type="number" id="timespan" value="10" min="1" max="300" step="1" aria-label="Time window in seconds"><label for="timespan">s</label></div>
        <div class="control-group"><label for="mode">Layout</label><select id="mode"><option value="overlay">Overlay</option><option value="split">Split</option></select></div>
        <span class="series-count" id="series-count">0 series</span>
    </div>
    <div class="chart-area">
        <div class="chart-row">
            <div class="chart-container">
                <canvas id="graph-canvas" role="img" aria-label="Real-time variable graph"></canvas>
                <div id="empty-state" class="empty-state"><strong>Waiting for samples</strong><span>Selected numeric fields will appear here as data arrives.</span></div>
                <div class="tooltip" id="tooltip"></div>
            </div>
            <div class="scrollbar-y" title="Y-axis zoom (drag to zoom vertically)">
                <input type="range" id="slider-y" aria-label="Vertical zoom" min="1" max="200" value="100" step="1">
            </div>
        </div>
        <div class="scrollbar-t" title="Time-axis zoom (drag to zoom horizontally)">
            <input type="range" id="slider-t" aria-label="Time zoom" min="1" max="200" value="100" step="1">
        </div>
    </div>
    <div class="legend" id="legend"></div>

    <script nonce="${nonce}" src="${scriptUri}"></script>
</body>
</html>
