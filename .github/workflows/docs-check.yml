name: Build Documentation

on:
  push:
    branches:
      - main
    paths:
      - "apps/docs/**"
      # Published verbatim by the docs site via `staticDirectories` in
      # docusaurus.config.ts, so edits here must redeploy the site too.
      - "packages/mcu-debug/support/skills/**"
  workflow_dispatch:

permissions:
  contents: read

# Documentation is checked and archived; this fork has no GitHub Pages site.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/docs/package-lock.json

      - name: Install dependencies
        working-directory: apps/docs
        run: npm ci

      - name: Build
        working-directory: apps/docs
        run: npm run build

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcu-ai-debug-docs
          path: apps/docs/build
          if-no-files-found: error
          retention-days: 7
