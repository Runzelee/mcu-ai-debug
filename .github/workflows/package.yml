name: Package Extensions

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify fork sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/mdbg
      - run: npm ci
      - run: node scripts/sync-versions.js --check
      - name: Verify release tag matches extension version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected_tag="v$(node -p "require('./packages/mcu-debug/package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match extension version $expected_tag"
            exit 1
          fi

      - run: node scripts/release-notes.js > /dev/null
      - run: npm run test:rust
      - run: npm run lint:rust
      - run: npm test
      - run: npm run typecheck:cockpit
      - run: npm run check:shared-package

  build-binaries:
    name: Build Rust Binaries
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-windows
          - os: macos-latest
            platform: darwin

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/mdbg
          shared-key: release-${{ matrix.platform }}

      - name: Install Cross-compilation tools (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo install cross --git https://github.com/cross-rs/cross.git --locked

      - name: Build Binaries (Linux & Windows via Cross)
        if: matrix.os == 'ubuntu-latest'
        run: |
          bash ./scripts/build-binaries.sh prod
        env:
          CI: true

      - name: Build Binaries (Darwin Native)
        if: matrix.os == 'macos-latest'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cd packages/mdbg
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --bin mdbg --target "$target"
          done
          mkdir -p ../mcu-debug/bin/darwin-arm64 ../mcu-debug/bin/darwin-x64
          cp target/aarch64-apple-darwin/release/mdbg ../mcu-debug/bin/darwin-arm64/mdbg
          cp target/x86_64-apple-darwin/release/mdbg ../mcu-debug/bin/darwin-x64/mdbg
        env:
          CI: true

      - name: Upload Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.platform }}
          path: packages/mcu-debug/bin/
          if-no-files-found: error

  package:
    name: Package VSIX
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci

      - name: Download All Binaries
        uses: actions/download-artifact@v4
        with:
          path: bin-artifacts

      - name: Consolidate Binaries
        run: |
          mkdir -p packages/mcu-debug/bin

          # Artifact uploads discard Unix executable bits. Missing artifacts must fail.
          cp -a bin-artifacts/binaries-linux-windows/. packages/mcu-debug/bin/
          cp -a bin-artifacts/binaries-darwin/. packages/mcu-debug/bin/
          find packages/mcu-debug/bin -type f -name mdbg -exec chmod 755 {} +

      - name: Build, Package and Verify Unified VSIX
        run: npm run package:unified
        env:
          CI: true

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcu-ai-debug-vsix
          path: dist/*.vsix
          if-no-files-found: error
          retention-days: 7

      - name: Prepare Release Notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/release-notes.js > dist/release-notes.md

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: MCU AI Debug ${{ github.ref_name }}
          body_path: dist/release-notes.md
          files: |
            dist/*.vsix
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-open-vsx:
    name: Publish to Open VSX
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Download VSIX Artifact
        uses: actions/download-artifact@v4
        with:
          name: mcu-ai-debug-vsix
          path: dist

      - name: Publish Exact VSIX
        shell: bash
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [[ -z "$OVSX_PAT" ]]; then
            echo "::error::Repository secret OVSX_PAT is not configured"
            exit 1
          fi
          shopt -s nullglob
          vsix_files=(dist/*.vsix)
          if [[ ${#vsix_files[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one downloaded VSIX, found ${#vsix_files[@]}"
            exit 1
          fi
          npx --yes ovsx@1.2.0 publish "${vsix_files[0]}"
